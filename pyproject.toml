[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failure-analytics"
version = "1.0.0"
description = "Manufacturing test failure, yield and trend analytics with SPC and root cause analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kyle Gibson" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "plotly>=5.20",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["templates/*.j2", "sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
